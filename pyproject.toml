[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playstore-review-service"
version = "0.1.0"
description = "Hosted Play Store review-analysis service (FastAPI + Gemini). Phase 0: scraper core."
readme = "Readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anuj Saini" }]
dependencies = [
  # Unofficial scraper — pinned with an upper bound; it can break on Google changes.
  "google-play-scraper>=1.2.4,<1.3",
]

# Later phases add their own extras here (api: fastapi/uvicorn, db: sqlalchemy/alembic,
# llm: google-genai). Left out until those phases are actually built.
[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/playstore_review_service"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Legacy single-file script, superseded by src/playstore_review_service/scraper/.
# Kept for reference pending removal; excluded from lint/format so it doesn't gate the
# new package baseline.
extend-exclude = ["fetch_reviews.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
