[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playstore-review-service"
version = "0.1.0"
description = "Hosted Play Store review-analysis service (FastAPI + Gemini). Phase 0: scraper core."
readme = "Readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anuj Saini" }]
dependencies = [
  # Unofficial scraper — EXACT pin (shape-stable): patch bumps have historically changed
  # response dict shapes silently. Upgrades are an explicit PR step: bump, run tests, commit.
  "google-play-scraper==1.2.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "google-genai>=1.0",  # legacy Gemini provider path
  "requests>=2.32",  # OpenAI-compatible (OCI GenAI) provider path
  "authlib>=1.3",  # Google OAuth
  "itsdangerous>=2.0",  # signed session cookies (Starlette SessionMiddleware)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]  # prod database driver (postgresql+psycopg://)
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "httpx>=0.27",  # FastAPI TestClient transport
]

[project.scripts]
pmr-serve = "playstore_review_service.webapp:main"
pmr-worker = "playstore_review_service.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/playstore_review_service"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Legacy single-file script, superseded by src/playstore_review_service/scraper/.
# Kept for reference pending removal; excluded from lint/format so it doesn't gate the
# new package baseline.
extend-exclude = ["fetch_reviews.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `param: T = Depends(...)` is the idiomatic DI pattern, not a mutable default.
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
