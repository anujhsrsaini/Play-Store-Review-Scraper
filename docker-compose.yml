# Production stack for the Oracle Ampere box. Reads secrets from a local .env file
# (gitignored). Bring up with:  docker compose up -d --build
#
# Services:  caddy (public TLS) -> web (FastAPI)  +  worker (scrape/LLM)  +  db (Postgres)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pmr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-playstore_reviews}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: pmr-serve
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEV_INPROCESS_WORKER: 0
      SESSION_COOKIE_SECURE: 1
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pmr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-playstore_reviews}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    command: pmr-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pmr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-playstore_reviews}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN (your subdomain) in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
